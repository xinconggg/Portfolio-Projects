[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "equity-microstructure-execution-framework"
version = "0.1.0"
description = "Research infrastructure for equity market microstructure and order execution"
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "PyYAML>=6.0",
]


[project.optional-dependencies]

dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "ruff>=0.5",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = [
    "tests"
]


[tool.ruff]
line-length = 100
target-version = "py311"